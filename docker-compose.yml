services:
  postgres:
    image: postgres:17-alpine
    container_name: bookreview-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bookreview
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bookreview-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bookreview-pgdata:
    name: bookreview-pgdata
